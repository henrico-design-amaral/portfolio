name: Validate Static Portfolio

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - chore/**
      - governance/**

permissions:
  contents: read

jobs:
  validate:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check
